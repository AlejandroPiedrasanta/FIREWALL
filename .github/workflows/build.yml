name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Pruebas
        run: go test ./...

      - name: Vet (Windows)
        run: GOOS=windows GOARCH=amd64 go vet . 2>&1 | grep -v "possible misuse of unsafe.Pointer" || true

      - name: Compilar
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MiniWall
          path: dist/MiniWall.exe

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MiniWall.exe
